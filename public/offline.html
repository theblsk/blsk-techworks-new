<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BLSK Labs | Custom Software Development Company</title>
    <style>
      :root {
        color-scheme: dark;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at top, rgba(66, 40, 201, 0.28), transparent 36%),
          #080b16;
        color: #f8fafc;
        font-family: Inter, system-ui, sans-serif;
      }

      main {
        width: min(32rem, calc(100% - 3rem));
        padding: 2rem;
        border: 1px solid rgba(148, 163, 184, 0.2);
        border-radius: 1.5rem;
        background: rgba(15, 23, 42, 0.68);
        backdrop-filter: blur(18px);
      }

      h1 {
        margin: 0 0 0.75rem;
        font-size: clamp(2rem, 4vw, 3rem);
        line-height: 1.05;
      }

      p {
        margin: 0 0 1rem;
        color: rgba(226, 232, 240, 0.82);
        line-height: 1.6;
      }

      a {
        color: inherit;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>You&apos;re offline.</h1>
      <p>BLSK Labs is still available once your connection comes back. Reconnect and refresh to keep browsing.</p>
      <p><a href="/">Try again</a></p>
    </main>
  </body>
</html>
