<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>BLSK Labs | Custom Software Development Company</title>
    <link rel="stylesheet" href="/brand-tokens.css" />
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at top, hsl(var(--patina) / 0.28), transparent 36%),
          hsl(var(--background));
        color: hsl(var(--foreground));
        font-family: Inter, system-ui, sans-serif;
      }

      main {
        width: min(32rem, calc(100% - 3rem));
        padding: 2rem;
        border: 1px solid hsl(var(--border) / 0.35);
        border-radius: 1.5rem;
        background: hsl(var(--card) / 0.72);
        backdrop-filter: blur(18px);
      }

      h1 {
        margin: 0 0 0.75rem;
        font-size: clamp(2rem, 4vw, 3rem);
        line-height: 1.05;
      }

      p {
        margin: 0 0 1rem;
        color: hsl(var(--muted-foreground) / 0.9);
        line-height: 1.6;
      }

      a {
        color: hsl(var(--signal));
      }
    </style>
  </head>
  <body>
    <main>
      <h1>You&apos;re offline.</h1>
      <p>BLSK Labs is still available once your connection comes back. Reconnect and refresh to keep browsing.</p>
      <p><a href="/">Try again</a></p>
    </main>
  </body>
</html>
